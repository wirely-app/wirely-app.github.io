# Builds Wirely for Windows, Mac and Linux on GitHub's own computers, tests each one, and attaches the
# downloads to the release — so there's nothing to build by hand.
#   - Publishing a release: builds all three and attaches
#       Wirely-Setup-<rev>.exe, Wirely-<rev>-mac-arm64.dmg and Wirely-<rev>-x86_64.AppImage
#   - Actions tab → "Build (Windows, Mac, Linux)" → Run workflow: a test build. The files, a screenshot of
#     Wirely running on the Mac and the logs go on a "Test builds" DRAFT release instead — drafts are only
#     visible to you (Releases page), never to the public. Each test run replaces the previous test files.
#   - Every push also runs the automatic tests (the "tests" job), without building anything.
name: Build (Windows, Mac, Linux)

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ the automatic tests (every push)
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements (and ngspice, which some tests compare against)
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
          WIRELY_NO_SOUND: "1"
        run: python -m pytest -q tests

  # ------------------------------------------------------------------ test runs: one private draft to put them on
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.v.outputs.rev }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "rev=$(python3 -c 'import wirely; print(wirely.__revision__)')" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import wirely; print(wirely.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Make sure the "Test builds" draft exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view test-builds >/dev/null 2>&1 || \
            gh release create test-builds --draft --title "Test builds" \
              --notes "Automatic test builds (draft - only visible to you). Each test run replaces these files."

  # ------------------------------------------------------------------ Windows: installer
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.16"
      - name: Build Wirely.exe and check it starts
        run: |
          python -m PyInstaller packaging/wirely.spec --noconfirm --clean --distpath dist --workpath build
          rm -f selftest.txt
          dist/Wirely/Wirely.exe --self-test "$PWD/selftest.txt"
          cat selftest.txt
          grep -q '^OK' selftest.txt
      - name: Build the installer
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          "$ISCC" //Q "//DAppVersion=${{ needs.prepare.outputs.version }}" "//DAppRevision=${{ needs.prepare.outputs.rev }}" packaging/Wirely.iss
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: wirely-windows
          path: dist/Wirely-Setup-*.exe
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; else TAG=test-builds; fi
          gh release upload "$TAG" dist/Wirely-Setup-*.exe --clobber

    # ------------------------------------------------------------------ Mac: .dmg (Apple Silicon and Intel)
  mac:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel      # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run the tests
        env:
          WIRELY_NO_SOUND: "1"
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests 2>&1 | tee test-results-${{ matrix.arch }}.txt
      - name: Build Wirely.app and the .dmg
        run: bash packaging/mac/build_mac.sh 2>&1 | tee build-log-${{ matrix.arch }}.txt
      - name: Start the app and take a screenshot
        continue-on-error: true
        run: |
          dist/Wirely.app/Contents/MacOS/Wirely "examples/555 LED flasher.wirely" --snapshot "$PWD/mac-screenshot-${{ matrix.arch }}.png" > app-log-${{ matrix.arch }}.txt 2>&1 &
          APP=$!
          for i in $(seq 1 60); do kill -0 $APP 2>/dev/null || break; sleep 1; done
          if [ -f mac-screenshot-${{ matrix.arch }}.png ]; then echo "SNAPSHOT OK" >> app-log-${{ matrix.arch }}.txt; else echo "NO SNAPSHOT" >> app-log-${{ matrix.arch }}.txt; fi
          kill $APP 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: wirely-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            mac-screenshot-${{ matrix.arch }}.png
            app-log-${{ matrix.arch }}.txt
            build-log-${{ matrix.arch }}.txt
            test-results-${{ matrix.arch }}.txt
          if-no-files-found: warn
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber
          else
            files=""
            for f in dist/*.dmg mac-screenshot-${{ matrix.arch }}.png app-log-${{ matrix.arch }}.txt build-log-${{ matrix.arch }}.txt test-results-${{ matrix.arch }}.txt; do [ -f "$f" ] && files="$files $f"; done
            gh release upload test-builds $files --clobber
          fi
  # ------------------------------------------------------------------ Linux: AppImage
  linux:
    needs: prepare
    runs-on: ubuntu-22.04      # an older Ubuntu, so the AppImage also runs on older Linux systems
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3 libpulse0 file
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build the AppImage
        run: PYTHON=python bash packaging/linux/build_appimage.sh
      - name: Check it starts on Wayland (native, and X11 apps through XWayland)
        continue-on-error: true
        run: |
          sudo apt-get install -y weston xwayland
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          APP=$(ls dist/*.AppImage)
          weston --backend=headless-backend.so --socket=wl-ci --xwayland > weston.log 2>&1 &
          sleep 5
          env -u DISPLAY WAYLAND_DISPLAY=wl-ci WIRELY_NO_SOUND=1 timeout 90 "$APP" --appimage-extract-and-run \
            "examples/555 LED flasher.wirely" --snapshot "$PWD/wayland.png"
          XD=$(grep -o "listening on display :[0-9]*" weston.log | grep -o ":[0-9]*" | head -1)
          DISPLAY=$XD WAYLAND_DISPLAY=wl-ci WIRELY_NO_SOUND=1 timeout 90 "$APP" --appimage-extract-and-run \
            "examples/555 LED flasher.wirely" --snapshot "$PWD/xwayland.png"
          ls -la wayland.png xwayland.png
      - uses: actions/upload-artifact@v4
        with:
          name: wirely-linux
          path: dist/*.AppImage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; else TAG=test-builds; fi
          gh release upload "$TAG" dist/*.AppImage --clobber
